<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LLMate</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e2e2dd; --accent: #2f5bea; --accent-text: #ffffff;
    --user: #e8eefc; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1e1e1c; --text: #ececea; --muted: #9a9a94;
      --border: #33332f; --accent: #6d8cff; --accent-text: #0d0d0c;
      --user: #26304a; --error: #f97066;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button {
    border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer;
    background: var(--accent); color: var(--accent-text); font-weight: 600;
  }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 6px 12px; font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .hidden { display: none !important; }

  /* Login */
  #login { min-height: 100%; display: grid; place-items: center; padding: 16px; }
  #login form {
    width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px; display: grid; gap: 14px;
  }
  #login h1 { margin: 0; font-size: 22px; }
  #login p { margin: 0; color: var(--muted); font-size: 14px; }
  #login input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
  }
  .error { color: var(--error); font-size: 14px; min-height: 1.2em; }

  /* Chat */
  #chat { height: 100%; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header strong { font-size: 17px; }
  header .left { display: flex; align-items: center; gap: 12px; }
  #provider {
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
  }
  #provider:disabled { opacity: .7; }
  header .actions { display: flex; gap: 8px; }
  #log { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .inner { max-width: 760px; margin: 0 auto; }
  .msg { margin: 0 0 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); padding: 10px 14px; border-radius: 12px; width: fit-content; max-width: 85%; margin-left: auto; }
  .msg.assistant { padding: 2px 2px; }
  .msg .meta { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .msg.err { color: var(--error); }
  .empty { color: var(--muted); text-align: center; margin-top: 20vh; }
  form#composer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 16px; }
  form#composer .inner { display: flex; gap: 8px; align-items: flex-end; }
  #input {
    flex: 1; resize: none; max-height: 200px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg);
  }
</style>
</head>
<body>

<section id="login" class="hidden">
  <form id="loginForm" autocomplete="off">
    <h1>LLMate</h1>
    <p>Enter your access token.</p>
    <input id="token" type="password" placeholder="Access token" required autofocus>
    <div class="error" id="loginError"></div>
    <button type="submit" id="loginBtn">Log in</button>
  </form>
</section>

<section id="chat" class="hidden">
  <header>
    <div class="left">
      <strong>LLMate</strong>
      <select id="provider" aria-label="Provider" title="Provider for this chat. Start a new chat to switch."></select>
    </div>
    <div class="actions">
      <button class="ghost" id="newChat" type="button">New chat</button>
      <button class="ghost" id="logout" type="button">Log out</button>
    </div>
  </header>
  <div id="log"><div class="inner" id="messages"></div></div>
  <form id="composer">
    <div class="inner">
      <textarea id="input" rows="1" placeholder="Message (Enter to send, Shift+Enter for a new line)"></textarea>
      <button type="submit" id="send">Send</button>
    </div>
  </form>
</section>

<script>
const KEY = "llmate.token";
const PKEY = "llmate.provider";
const LABELS = { gemini: "Gemini", groq: "Groq" };
const $ = (id) => document.getElementById(id);
let history = [];

const store = {
  get(k = KEY) { try { return localStorage.getItem(k); } catch { return null; } },
  set(v, k = KEY) { try { localStorage.setItem(k, v); } catch {} },
  clear() { try { localStorage.removeItem(KEY); } catch {} },
};

// Fill the picker with the providers the server has keys for.
function setProviders(list) {
  const sel = $("provider");
  const keep = sel.value || store.get(PKEY);
  sel.replaceChildren(...(list || []).map((p) => new Option(LABELS[p] || p, p)));
  if (list && list.includes(keep)) sel.value = keep;
}

// The provider is fixed once it has answered in this chat; "New chat" unlocks it.
// Until then (e.g. the first request failed) it can still be changed.
function lockProvider() {
  $("provider").disabled = history.some((m) => m.role === "assistant" && !m.error && !m.pending);
}

async function api(path, token, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "content-type": "application/json", authorization: "Bearer " + token },
    body: JSON.stringify(body || {}),
  });
  let data = {};
  try { data = await res.json(); } catch {}
  return { status: res.status, data };
}

function show(view) {
  $("login").classList.toggle("hidden", view !== "login");
  $("chat").classList.toggle("hidden", view !== "chat");
  if (view === "chat") $("input").focus();
}

function logout(message) {
  store.clear();
  history = [];
  render();
  $("token").value = "";
  $("loginError").textContent = message || "";
  show("login");
}

function alertBox(text) {
  history.push({ role: "assistant", content: text, error: true });
  render();
}

function render() {
  lockProvider();
  const box = $("messages");
  box.replaceChildren();
  if (history.length === 0) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Start a conversation.";
    box.append(p);
    return;
  }
  for (const m of history) {
    const div = document.createElement("div");
    div.className = "msg " + m.role + (m.error ? " err" : "");
    div.textContent = m.content; // textContent: model output is never parsed as HTML
    if (m.meta) {
      const s = document.createElement("span");
      s.className = "meta";
      s.textContent = m.meta;
      div.append(s);
    }
    box.append(div);
  }
  $("log").scrollTop = $("log").scrollHeight;
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const token = $("token").value.trim();
  $("loginBtn").disabled = true;
  $("loginError").textContent = "";
  try {
    const { status, data } = await api("/api/verify", token);
    if (status === 200) { store.set(token); setProviders(data.providers); show("chat"); render(); }
    else $("loginError").textContent = status === 401 ? "That token is not valid." : "Server error (" + status + ").";
  } catch {
    $("loginError").textContent = "Could not reach the server.";
  } finally {
    $("loginBtn").disabled = false;
  }
});

$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  const token = store.get();
  const provider = $("provider").value;
  if (!text || !token) return;
  if (!provider) { alertBox("No provider is configured on the server."); return; }
  $("input").value = "";
  autosize();
  history.push({ role: "user", content: text });
  const pending = { role: "assistant", content: "…", pending: true };
  history.push(pending);
  render();
  $("send").disabled = true;
  try {
    const turns = history.filter((m) => !m.pending && !m.error).map(({ role, content }) => ({ role, content }));
    const { status, data } = await api("/api/chat", token, { provider, messages: turns });
    if (status === 401) return logout("Your token was rejected. Log in again.");
    if (status === 200) Object.assign(pending, { content: data.text, meta: data.provider + " · " + data.model, pending: false });
    else {
      let msg = data.error || "Request failed (" + status + ").";
      if (/\b429\b/.test(msg)) msg += " (rate limited). Try again later, or pick another provider.";
      Object.assign(pending, { content: msg, error: true, pending: false });
    }
  } catch {
    Object.assign(pending, { content: "Could not reach the server.", error: true, pending: false });
  } finally {
    $("send").disabled = false;
    render();
    $("input").focus();
  }
});

function autosize() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 200) + "px";
}
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); }
});
$("provider").addEventListener("change", () => store.set($("provider").value, PKEY));
$("newChat").addEventListener("click", () => { history = []; render(); $("input").focus(); });
$("logout").addEventListener("click", () => logout());

// Restore a saved token, checking it is still valid.
(async () => {
  const token = store.get();
  if (!token) return show("login");
  try {
    const { status, data } = await api("/api/verify", token);
    if (status === 200) { setProviders(data.providers); show("chat"); render(); } else logout("Your saved token is no longer valid.");
  } catch { show("chat"); render(); }
})();
</script>
</body>
</html>
